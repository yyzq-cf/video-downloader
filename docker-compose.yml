services:
  video-downloader:
    image: ywsj/video-downloader:latest
    container_name: video-downloader
    restart: always
    ports:
      - "5200:5200"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - PORT=5200
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin123
      - SECRET_KEY=change-me-to-a-random-string
    tmpfs:
      - /tmp:size=2G
